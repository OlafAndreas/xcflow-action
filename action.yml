name: Install xcflow
description: Installs the pinned xcflow release on a Linux runner. xcflow plans and applies the Xcode Cloud workflows in XcodeCloud/.
author: Olaf Andreas Øvrum
branding:
  icon: code
  color: purple

runs:
  using: composite
  steps:
    - name: Install xcflow 0.2.9
      shell: bash
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) NAME="xcflow-0.2.9-linux-x86_64.tar.gz"; SUM="571e048f761911eab8b58ac8baccc81b4330de3b3bc841560fac2caecba41a3b" ;;
          Linux-ARM64) NAME="xcflow-0.2.9-linux-aarch64.tar.gz"; SUM="79a238162f608e04d16641af5350692c1017fed6cb916e98800695d60fab57ce" ;;
          *) echo "::error::This action installs xcflow on Linux runners only, not on $RUNNER_OS $RUNNER_ARCH. Use runs-on: ubuntu-latest."; exit 1 ;;
        esac
        ARCHIVE="$RUNNER_TEMP/xcflow.tar.gz"
        curl -fsSL -o "$ARCHIVE" "https://github.com/OlafAndreas/xcflow/releases/download/v0.2.9/$NAME"
        if [ -n "$SUM" ]; then
          echo "$SUM  $ARCHIVE" | shasum -a 256 -c -
        fi
        mkdir -p "$RUNNER_TEMP/xcflow"
        tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/xcflow"
        echo "$RUNNER_TEMP/xcflow" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/xcflow/xcflow" --version

