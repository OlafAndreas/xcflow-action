name: Install xcflow
description: "Installs xcflow: Xcode Cloud workflows as JSON in your repo. Review in pull requests, apply on merge, catch drift nightly."
author: Olaf Andreas Øvrum
branding:
  icon: code
  color: purple

runs:
  using: composite
  steps:
    - name: Install xcflow 0.4.0
      shell: bash
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) NAME="xcflow-0.4.0-linux-x86_64.tar.gz"; SUM="755da12e215bc169356da0b4a4b70089d5bba995280909601185ff14504e154a" ;;
          Linux-ARM64) NAME="xcflow-0.4.0-linux-aarch64.tar.gz"; SUM="15228402ee51f9a40955c37ac06a71be25be342d3f653a1f00164dfcf2fd13fe" ;;
          *) echo "::error::This action installs xcflow on Linux runners only, not on $RUNNER_OS $RUNNER_ARCH. Use runs-on: ubuntu-latest."; exit 1 ;;
        esac
        ARCHIVE="$RUNNER_TEMP/xcflow.tar.gz"
        curl -fsSL -o "$ARCHIVE" "https://github.com/OlafAndreas/xcflow/releases/download/v0.4.0/$NAME"
        if [ -n "$SUM" ]; then
          echo "$SUM  $ARCHIVE" | shasum -a 256 -c -
        fi
        mkdir -p "$RUNNER_TEMP/xcflow"
        tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/xcflow"
        echo "$RUNNER_TEMP/xcflow" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/xcflow/xcflow" --version

